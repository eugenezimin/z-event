# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/)

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# BSD-3-Clause, ISC and Zlib are not used yet; they are common in the
# Postgres and gRPC stacks the adapters will bring in.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
