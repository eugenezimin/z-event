[workspace]
resolver = "3"
members = [
    "core",
    "adapters/memory",
    "adapters/postgres",
    "adapters/grpc",
    "cli",
    "testkit",
    "examples/in-process",
    "examples/split",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
authors = ["Eugene Zimin <eugene@ziminpro.com>"]
keywords = ["outbox", "events", "event-driven", "transactional", "feed"]
categories = ["asynchronous", "database"]

[workspace.dependencies]
z-event         = { path = "core", version = "0.1.0" }
z-event-memory  = { path = "adapters/memory", version = "0.1.0" }
z-event-postgres = { path = "adapters/postgres", version = "0.1.0" }
z-event-grpc    = { path = "adapters/grpc", version = "0.1.0" }
z-event-testkit = { path = "testkit", version = "0.1.0" }

tokio       = { version = "1.47", default-features = false }
tokio-util  = { version = "0.7", default-features = false }
futures     = { version = "0.3", default-features = false, features = ["std", "async-await"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
bytes       = { version = "1", features = ["serde"] }
thiserror   = "2"
tracing     = "0.1"
metrics     = "0.24"
metrics-util = { version = "0.20", default-features = false, features = ["registry"] }
ulid        = { version = "1", features = ["serde"] }
time        = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
fastrand    = "2"
# sqlx 0.8 matches z-auth, so hosts can share one transaction type.
sqlx        = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "time", "json"] }
testcontainers-modules = { version = "0.15", features = ["postgres"] }
tonic       = { version = "0.14", default-features = false }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost       = "0.14"
prost-types = "0.14"
protox      = "0.10"
tokio-stream = { version = "0.1", default-features = false }
x509-parser = "0.18"
rcgen       = "0.14"
clap        = { version = "4", features = ["derive", "env"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
