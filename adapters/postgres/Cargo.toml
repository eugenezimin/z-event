[package]
name = "z-event-postgres"
description = "PostgreSQL storage adapter for z-event: transactional outbox, sequencer, LISTEN/NOTIFY, cursors and dead letters (sqlx)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
z-event    = { workspace = true }
bytes      = { workspace = true }
futures    = { workspace = true }
serde_json = { workspace = true }
sqlx       = { workspace = true }
thiserror  = { workspace = true }
time       = { workspace = true }
tokio      = { workspace = true, features = ["sync", "rt", "macros"] }
tracing    = { workspace = true }
ulid       = { workspace = true }

[dev-dependencies]
z-event-testkit        = { workspace = true }
testcontainers-modules = { workspace = true }
tokio                  = { workspace = true, features = ["sync", "time", "rt", "rt-multi-thread", "macros"] }

[lints]
workspace = true
